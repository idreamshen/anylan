name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux binaries
        run: make build-linux

      - name: Test
        run: make test

      - name: Upload Linux client
        uses: actions/upload-artifact@v4
        with:
          name: anylan-client-linux-amd64
          path: out/anylan-client-linux-amd64
          retention-days: 7

      - name: Upload Linux server
        uses: actions/upload-artifact@v4
        with:
          name: anylan-server-linux-amd64
          path: out/anylan-server-linux-amd64
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add dotnet tools to PATH
        shell: pwsh
        run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows client MSI
        shell: pwsh
        run: ./scripts/build-windows-msi.ps1

      - name: Build Windows server
        shell: pwsh
        run: go build -o out/anylan-server-windows-amd64.exe ./cmd/server

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: anylan-client-windows-amd64
          path: out/anylan-client-windows-amd64.msi
          retention-days: 7

      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: anylan-server-windows-amd64
          path: out/anylan-server-windows-amd64.exe
          retention-days: 7

  darwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Darwin client
        run: make build-darwin

      - name: Upload Darwin client amd64
        uses: actions/upload-artifact@v4
        with:
          name: anylan-client-darwin-amd64
          path: out/anylan-client-darwin-amd64
          retention-days: 7

      - name: Upload Darwin client arm64
        uses: actions/upload-artifact@v4
        with:
          name: anylan-client-darwin-arm64
          path: out/anylan-client-darwin-arm64
          retention-days: 7

      - name: Upload Darwin server amd64
        uses: actions/upload-artifact@v4
        with:
          name: anylan-server-darwin-amd64
          path: out/anylan-server-darwin-amd64
          retention-days: 7

      - name: Upload Darwin server arm64
        uses: actions/upload-artifact@v4
        with:
          name: anylan-server-darwin-arm64
          path: out/anylan-server-darwin-arm64
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/anylan-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

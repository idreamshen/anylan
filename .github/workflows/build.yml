name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anylan-linux
          path: out/

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows client
        run: make build-windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anylan-windows
          path: out/
